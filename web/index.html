<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>3D 사무실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='11' rx='2' fill='%2327AE60'/%3E%3Crect x='4' y='6' width='3' height='3' fill='%23fff'/%3E%3Crect x='9' y='6' width='3' height='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 위 얇은 막대 — 제목·상태 요약·데모 표시·언어 -->
<header id="top">
  <h1 data-i18n="title">3D 사무실</h1>
  <p id="summary" aria-live="polite"></p>
  <span id="demo" data-i18n="demo" hidden>데모 데이터</span>
  <a id="ask-link" href="admin.html" class="ask" hidden></a>
  <button type="button" id="inbox-link" data-i18n-aria="inbox"><span data-i18n="inbox">📥 받은편지함</span><b id="inbox-n" hidden></b></button>
  <a id="admin-link" href="admin.html" data-i18n="admin" data-i18n-aria="admin.label">⚙ 관리자</a>
  <div id="lang" role="group" data-i18n-aria="lang.label" aria-label="언어">
    <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main id="main">
  <!-- 가운데 사무실 — 캔버스 하나에 그린다(office-view.js), 움직임은 office-life.js -->
  <section id="office-stage">
    <div id="notice" role="status" hidden></div>
    <div id="office-box"><canvas id="office-canvas" data-i18n-aria="canvas.label" aria-label="사무실"></canvas></div>
  </section>
  <!-- 오른쪽 — 누가 무엇을 하는지 + 살아 움직이는 활동 로그(office-panel.js) -->
  <aside id="office-side">
    <h2><span data-i18n="side.people">사무실 사람들</span> <small id="office-count"></small></h2>
    <p class="o-hint" data-i18n="side.hint"></p>
    <ul id="office-people"></ul>
    <h2><span data-i18n="side.log">활동 로그</span> <small class="o-live">● LIVE</small></h2>
    <ol id="office-log"></ol>
  </aside>
  <!-- 업무 관제 독 — 캐릭터를 누르면 열린다(office-dock.js). 관리자 페이지와 같은 API -->
  <aside id="dock" hidden>
    <header class="d-head">
      <i id="dock-dot" class="o-dot"></i>
      <div class="d-who"><b id="dock-name">—</b><small id="dock-meta"></small></div>
      <nav id="dock-tabs"><button type="button" data-tab="all" data-i18n="dock.tab.all">전체</button><button type="button" data-tab="chat" class="on" data-i18n="dock.tab.chat">대화</button><button type="button" data-tab="today" data-i18n="dock.tab.today">오늘</button></nav>
      <a id="dock-admin" href="admin.html" title="관리자" data-i18n="dock.admin">⚙</a>
      <button type="button" id="dock-close" title="닫기">✕</button>
    </header>
    <small id="dock-path" class="d-path"></small>
    <section id="dock-chat" class="d-body">
      <ol id="dock-msgs" class="d-msgs"></ol>
      <footer class="d-composer">
        <div id="dock-quick" class="d-quick"></div>
        <textarea id="dock-input" rows="3" data-i18n-ph="dock.ph" placeholder="업무를 적어 보내세요 — Ctrl+Enter"></textarea>
        <div class="d-row">
          <select id="dock-proc"><option value="" data-i18n="dock.proc.none">절차서 없음</option></select>
          <select id="dock-mode">
            <option value="acceptEdits" data-i18n="mode.acceptEdits">파일만 고치기</option>
            <option value="auto" data-i18n="mode.auto">명령도 실행</option>
            <option value="plan" data-i18n="mode.plan">계획만</option>
            <option value="bypass" data-i18n="mode.bypass">전부 자동 승인</option>
          </select>
          <label class="d-check"><input id="dock-cont" type="checkbox" checked><span data-i18n="dock.cont">이어서</span></label>
          <button type="button" id="dock-send" data-i18n="dock.send">보내기</button>
        </div>
        <span id="dock-status" class="d-status"></span>
      </footer>
    </section>
    <section id="dock-all" class="d-body" hidden>
      <ul id="dock-inbox" class="d-inbox"></ul>
    </section>
    <section id="dock-today" class="d-body" hidden>
      <h3><span data-i18n="today">오늘</span> <small id="dock-jdate"></small></h3>
      <ul id="dock-jlist" class="d-jlist"></ul>
      <div id="dock-jpend-wrap" hidden><h4 data-i18n="today.pending">밀린 것</h4><ul id="dock-jpend" class="d-jlist"></ul></div>
      <form id="dock-jform" class="d-row">
        <select id="dock-jkind"><option value="todo" data-i18n="j.todo">할 일</option><option value="note" data-i18n="j.note">메모</option></select>
        <input id="dock-jtext" type="text" maxlength="300" data-i18n-ph="j.ph" placeholder="할 일·메모 입력 후 Enter" autocomplete="off">
      </form>
      <div class="d-row"><button type="button" id="dock-morning" data-i18n="j.morning">☀️ 아침 브리핑</button><button type="button" id="dock-wrapup" data-i18n="j.wrapup">🌙 퇴근 전 정리</button></div>
      <pre id="dock-brief" class="d-brief" hidden></pre>
    </section>
  </aside>
</main>

<script src="i18n.js"></script>
<script src="office-world.js"></script>
<script src="office-atlas.js"></script>
<script src="office-draw.js"></script>
<script src="office-path.js"></script>
<script src="office-life.js"></script>
<script src="office-panel.js"></script>
<script src="office-dock.js"></script>
<script src="office-view.js"></script>
</body>
</html>
